# Instalador do Windows (Electron + NSIS), no mesmo formato do CI do gSender:
# - em todo push na branch e em PRs: gera o instalador sem assinatura e guarda como artefato;
# - numa tag v1.2.3: gera, assina (se os segredos existirem) e publica na Release do GitHub,
#   de onde o CarvCAM instalado baixa as atualizações.
name: Windows installer

on:
  push:
    tags: ["v*"]
    branches: [main, feat/windows-installer]
  pull_request:
    paths: ["desktop/**", "gsender-ui/**", "cam-engine/**", ".github/workflows/windows-installer.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          (cd cam-engine && npm ci)
          (cd gsender-ui && npm ci)
          (cd desktop && npm ci)

      - name: Test the machine protocol
        shell: bash
        run: cd gsender-ui && npx vitest run

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cd desktop && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build (and sign on tags)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          # Escolha um serviço de assinatura (veja docs/assinatura-de-codigo.md).
          WIN_SIGN_PROVIDER: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WIN_SIGN_PROVIDER || '' }}
          # Azure Artifact Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          # SSL.com eSigner
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          CODESIGNTOOL_DIR: ${{ github.workspace }}\CodeSignTool
        run: |
          if [ "$WIN_SIGN_PROVIDER" = "sslcom" ]; then
            curl -sSL -o cst.zip https://www.ssl.com/download/codesigntool-for-windows/
            mkdir -p CodeSignTool && unzip -q cst.zip -d CodeSignTool
          fi
          cd desktop
          PUBLISH=never
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then PUBLISH=always; fi
          npm run dist:win -- --publish "$PUBLISH"

      - uses: actions/upload-artifact@v4
        with:
          name: CarvCAM-Windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          retention-days: 14
