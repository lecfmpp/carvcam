# CarvCAM installers (Electron), in the same shape as gSender's CI:
#   Windows: NSIS (.exe) · Linux: AppImage and .deb (x64) · Raspberry Pi: AppImage and .deb (arm64, armv7l)
#   Mac: .dmg (Intel and Apple Silicon)
# On every push to the branch and on PRs: builds unsigned installers and keeps them as artifacts.
# On a v1.2.3 tag: builds, signs (if the secrets exist), publishes to the GitHub Release (where the
# installed app downloads its updates from) and also uploads fixed-name copies the website uses:
#   https://github.com/lecfmpp/carvcam-releases/releases/latest/download/CarvCAM-Windows-64Bit.exe
#   .../CarvCAM-Linux-x86_64.AppImage · .../CarvCAM-Linux-amd64.deb
#   .../CarvCAM-Linux-arm64.AppImage · .../CarvCAM-Linux-arm64.deb · .../CarvCAM-Linux-armv7l.AppImage · .../CarvCAM-Linux-armv7l.deb
#   .../CarvCAM-Mac-arm64.dmg · .../CarvCAM-Mac-x64.dmg
name: Installers

on:
  push:
    tags: ["v*"]
    branches: [main, feat/windows-installer]
  pull_request:
    paths: ["desktop/**", "gsender-ui/**", "cam-engine/**", ".github/workflows/installers.yml"]
  # Publish a version without pushing the tag through git: Actions › Installers › Run workflow, with the
  # version (e.g. 0.1.0). The job creates the v0.1.0 tag on the chosen commit and continues as for a tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

env:
  # Version to publish: the pushed tag (v1.2.3) or the one entered on a manual run. Empty = test build only.
  # Installers are published to a separate PUBLIC repository (this one is private), so the
  # website and the in-app updater can download them. RELEASES_TOKEN: a fine-grained token with
  # Contents: read and write on lecfmpp/carvcam-releases.
  RELEASES_REPO: lecfmpp/carvcam-releases
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.version != '' && format('v{0}', inputs.version) || '') }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        shell: bash
        run: |
          (cd cam-engine && npm ci)
          (cd gsender-ui && npm ci)
          (cd desktop && npm ci)
      - name: Test the machine protocol
        shell: bash
        run: cd gsender-ui && npx vitest run
      - name: Create the tag (manual release)
        if: env.RELEASE_TAG != '' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}"
      - name: Version from the tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: cd desktop && npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - name: Build (and sign on tags)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          # Pick a signing service (see docs/code-signing.md).
          WIN_SIGN_PROVIDER: ${{ env.RELEASE_TAG != '' && secrets.WIN_SIGN_PROVIDER || '' }}
          # Azure Artifact Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ env.RELEASE_TAG != '' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          # SSL.com eSigner
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          CODESIGNTOOL_DIR: ${{ github.workspace }}\CodeSignTool
        run: |
          if [ "$WIN_SIGN_PROVIDER" = "sslcom" ]; then
            curl -sSL -o cst.zip https://www.ssl.com/download/codesigntool-for-windows/
            mkdir -p CodeSignTool && unzip -q cst.zip -d CodeSignTool
          fi
          cd desktop
          PUBLISH=never
          if [[ -n "$RELEASE_TAG" ]]; then PUBLISH=always; fi
          npm run dist:win -- --publish "$PUBLISH"
      - name: Fixed-name copy for the website
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cd desktop/release
          cp CarvCAM-*-Windows-64Bit.exe CarvCAM-Windows-64Bit.exe
          gh release upload --repo "$RELEASES_REPO" "$RELEASE_TAG" CarvCAM-Windows-64Bit.exe --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: CarvCAM-Windows
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          retention-days: 14

  # Linux after Windows: on a tag, the first job creates the Release and the others only add files to it.
  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          (cd cam-engine && npm ci)
          (cd gsender-ui && npm ci)
          (cd desktop && npm ci)
      - name: Version from the tag
        if: env.RELEASE_TAG != ''
        run: cd desktop && npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - name: Build Linux (PC) and Raspberry Pi
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          LINUX_ARCHS: x64,arm64,armv7l
        run: |
          cd desktop
          PUBLISH=never
          if [[ -n "$RELEASE_TAG" ]]; then PUBLISH=always; fi
          npm run dist:linux -- --publish "$PUBLISH"
      - name: Fixed-name copies for the website
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cd desktop/release
          for f in CarvCAM-*-Linux-*; do
            fixed=$(echo "$f" | sed -E 's/^CarvCAM-[0-9][^-]*-Linux-/CarvCAM-Linux-/')
            cp "$f" "$fixed"
            gh release upload --repo "$RELEASES_REPO" "$RELEASE_TAG" "$fixed" --clobber
          done
      - uses: actions/upload-artifact@v4
        with:
          name: CarvCAM-Linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/latest-linux*.yml
          retention-days: 14

  # Mac is still "coming soon" on the website: this job only keeps the test .dmg and doesn't block the others.
  build-mac:
    needs: build-windows
    runs-on: macos-latest
    continue-on-error: true
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          (cd cam-engine && npm ci)
          (cd gsender-ui && npm ci)
          (cd desktop && npm ci)
      - name: Version from the tag
        if: env.RELEASE_TAG != ''
        run: cd desktop && npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - name: Build Mac (signed and notarized when the Apple secrets exist)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_MAC_CERT }}
        run: |
          cd desktop
          # Without an Apple certificate the .dmg is unsigned and only kept as an artifact (it doesn't go to the Release).
          # Secrets that don't exist arrive as empty strings; electron-builder would read an empty CSC_LINK
          # as a certificate path, so they are removed from the environment.
          if [[ "$HAS_MAC_CERT" != "true" ]]; then unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          PUBLISH=never
          if [[ -n "$RELEASE_TAG" && "$HAS_MAC_CERT" == "true" ]]; then PUBLISH=always; fi
          npm run dist:mac -- --publish "$PUBLISH"
      - name: Fixed-name copies for the website
        if: env.RELEASE_TAG != '' && env.HAS_MAC_CERT == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cd desktop/release
          for f in CarvCAM-*-Mac-*.dmg; do
            fixed=$(echo "$f" | sed -E 's/^CarvCAM-[0-9][^-]*-Mac-/CarvCAM-Mac-/')
            cp "$f" "$fixed"
            gh release upload --repo "$RELEASES_REPO" "$RELEASE_TAG" "$fixed" --clobber
          done
      - uses: actions/upload-artifact@v4
        with:
          name: CarvCAM-Mac
          path: desktop/release/*.dmg
          retention-days: 14
