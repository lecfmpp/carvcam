# CarvCAM web app (app.carvcam.com). A second Netlify site, separate from the marketing site,
# with "Base directory" = app so Netlify reads this file.
[build]
  # The app imports the CAM engine from ../cam-engine as source, so its dependencies are installed too.
  command = "npm --prefix ../cam-engine ci --no-audit --no-fund && npm run build"
  publish = "dist"
  # Rebuild when the app or the engine changes (by default Netlify only watches the base directory).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../cam-engine"

[build.environment]
  NODE_VERSION = "22"

# The app uses hash routes (#/create, #/job/…), so no SPA rewrite is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# The page and the service worker must always be fresh, so a new build shows up on the next reload.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/precache.json"
  [headers.values]
    Cache-Control = "no-cache"

# Built files carry a content hash in their name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
