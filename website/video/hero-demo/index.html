<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/geist-sans-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/geist-sans-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/geist-sans-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/geist-mono-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1200px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111214;
        font-family: "Geist", system-ui, sans-serif;
      }
      /* "camera": everything that belongs to the app screen (screenshots + cursor + highlights) lives here and gets the zoom */
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1200px;
        transform-origin: 0 0;
        will-change: transform;
      }
      #cam img.shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1200px;
        opacity: 0;
        visibility: hidden;
        display: block;
      }
      .hl {
        position: absolute;
        opacity: 0;
        border-radius: 14px;
        pointer-events: none;
        border: 3px solid #ff5b1f;
        box-shadow: 0 0 0 6px rgba(255, 91, 31, 0.25), 0 10px 40px rgba(255, 91, 31, 0.4);
        background: rgba(255, 91, 31, 0.06);
      }
      .ripple {
        position: absolute;
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        border-radius: 50%;
        border: 3px solid #ff5b1f;
        background: rgba(255, 91, 31, 0.25);
        opacity: 0;
        pointer-events: none;
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        opacity: 0;
        pointer-events: none;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.55));
      }
      #cursor svg {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 3px 3px;
      }
      /* fixed captions (not zoomed) */
      .cap {
        position: absolute;
        left: 50%;
        bottom: 46px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 34px 14px 16px;
        border-radius: 999px;
        background: #ffffff;
        color: #111214;
        font-weight: 600;
        font-size: 32px;
        letter-spacing: -0.02em;
        white-space: nowrap;
        opacity: 0;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
      }
      .cap em {
        font-style: normal;
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: #ff5b1f;
        color: #ffffff;
        font-family: "Geist Mono", monospace;
        font-size: 24px;
        font-weight: 500;
      }
      /* ===== brand: intro and outro ===== */
      #scene {
        position: absolute;
        inset: 0;
        clip-path: circle(0% at 50% 50%);
      }
      #intro {
        position: absolute;
        inset: 0;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .disc {
        position: absolute;
        left: -172px;
        top: -532px;
        width: 2264px;
        height: 2264px;
        border-radius: 50%;
        transform-origin: 50% 50%;
      }
      .orange {
        background: #ff5b1f;
      }
      .graphite {
        background: #111214;
      }
      .white {
        background: #ffffff;
      }
      svg.sig {
        display: block;
        width: 941px;
        height: 240px;
        overflow: visible;
      }
      svg.sig text {
        font-family: "Geist", sans-serif;
        font-weight: 600;
        font-size: 64px;
        letter-spacing: -1.3px;
        fill: #111214;
      }
      svg.sig tspan {
        font-family: "Geist Mono", monospace;
        font-weight: 500;
        letter-spacing: -0.5px;
      }
      svg.sig .flute {
        fill: none;
        stroke: #ff5b1f;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 1 1;
        stroke-dashoffset: 1;
      }
      #outro {
        position: absolute;
        inset: 0;
        visibility: hidden;
        overflow: hidden;
        pointer-events: none;
      }
      #outro .ocircle {
        position: absolute;
        right: -170px;
        top: -230px;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: #ff5b1f;
      }
      #outro .stack {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 54px;
        padding: 0 150px;
      }
      #outro svg.sig {
        width: 627px;
        height: 160px;
      }
      #outro .mask {
        overflow: hidden;
        padding-bottom: 10px;
      }
      #outro .tag,
      #outro .tag2 {
        font-weight: 600;
        font-size: 88px;
        letter-spacing: -0.045em;
        line-height: 1.02;
        color: #111214;
      }
      #outro .tag2 {
        color: #ff5b1f;
      }
      #outro .row {
        display: flex;
        align-items: center;
        gap: 40px;
      }
      #outro .cta {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 22px 38px;
        border-radius: 14px;
        background: #111214;
        color: #ffffff;
        font-weight: 600;
        font-size: 34px;
        letter-spacing: -0.015em;
      }
      #outro .rule {
        width: 120px;
        height: 6px;
        border-radius: 3px;
        background: #ff5b1f;
      }
      #outro .site {
        font-family: "Geist Mono", monospace;
        font-weight: 500;
        font-size: 34px;
        color: #111214;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34.875" data-width="1920" data-height="1200">
      <!-- intro: the icon assembles itself (board, bit plunging, chips) and the name comes in whole: CarvCAM -->
      <div id="intro">
        <svg class="sig" id="sigI" viewBox="0 0 392 100" aria-label="CarvCAM"></svg>
      </div>
      <div class="disc orange" id="d1I"></div>
      <div class="disc graphite" id="d2I"></div>

      <div id="scene">
        <div id="cam"></div>
        <div class="cap" id="cap1"><em>1</em>Type what you want carved</div>
        <div class="cap" id="cap2"><em>2</em>It plans every cut for your bit</div>
        <div class="cap" id="cap3"><em>3</em>Plug in. It checks every cable.</div>
        <div class="cap" id="cap4"><em>4</em>Press start. Watch it carve.</div>
      </div>

      <!-- outro: orange -> white and the same signature, now with the call to action -->
      <div class="disc orange" id="d1O"></div>
      <div class="disc white" id="d2O"></div>
      <div id="outro">
        <div class="ocircle" id="ocircle" data-layout-allow-overflow></div>
        <div class="stack">
          <svg class="sig" id="sigO" viewBox="0 0 392 100" aria-label="CarvCAM"></svg>
          <div>
            <div class="mask" data-layout-allow-overflow><div class="tag" id="tag1">From blank board</div></div>
            <div class="mask" data-layout-allow-overflow><div class="tag2" id="tag2">to finished sign.</div></div>
          </div>
          <div class="row" id="orow">
            <div class="cta" id="octa">Download for Windows <span>→</span></div>
            <div class="rule" id="orule"></div>
            <div class="site" id="osite">carvcam.com</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const K = 1920 / 1440; // app CSS px -> video px
      const W = 1920;
      const H = 1200;
      const cam = document.getElementById("cam");

      /* 0) signature: official icon (same paths as carvcam-icon.svg) split into animatable parts + "CarvCAM" as one word */
      const sigSVG = (sfx) => `
        <defs><clipPath id="nm${sfx}"><rect x="112" y="0" width="420" height="100" /></clipPath></defs>
        <rect id="sq${sfx}" width="100" height="100" rx="22.5" fill="#FF5B1F" />
        <g id="board${sfx}">
          <rect x="16" y="60" width="68" height="22" rx="4" fill="#111214" />
          <path d="M12 59 H57 V64 A5 5 0 0 1 52 69 H12 Z" fill="#FF5B1F" />
        </g>
        <g id="bit${sfx}">
          <g stroke="#FF5B1F" stroke-width="2.5">
            <rect x="46.5" y="16" width="9" height="26" rx="1.5" fill="#111214" />
            <path d="M45 42 H57 V65 L51 69.5 L45 65 Z" fill="#111214" stroke-linejoin="round" />
          </g>
          <path class="flute" id="f1${sfx}" pathLength="1" d="M46 51 L56 46.5" />
          <path class="flute" id="f2${sfx}" pathLength="1" d="M46 58.5 L56 54" />
        </g>
        <rect id="c1${sfx}" x="33" y="50" width="4.5" height="4.5" rx="1" fill="#111214" transform="rotate(20 35 52)" />
        <rect id="c2${sfx}" x="25" y="44" width="3.5" height="3.5" rx="1" fill="#111214" transform="rotate(-15 27 46)" />
        <g clip-path="url(#nm${sfx})"><text id="nmt${sfx}" x="126" y="72">Carv<tspan>CAM</tspan></text></g>`;
      document.getElementById("sigI").innerHTML = sigSVG("I");
      document.getElementById("sigO").innerHTML = sigSVG("O");

      /* 1) layers: real app screenshots in chronological order (the upper one always covers the one below) */
      const SHOTS = [
        "a0-blank", "a1-text", "a2-t1", "a2-t2", "a2-t3", "a2-t4", "a3-font", "a3-h1", "a3-h2", "a3-h3",
        "b0-prepare", "b1-play1", "b1-play2", "b1-play3", "b1-play4", "b1-play5", "b1-play6", "b1-playend", "b2-3d",
        "c0-wiz", "c1-step0", "c1-step0-t0", "c1-step1", "c1-step1-t0", "c1-step2", "c1-step2-t0", "c1-step3", "c1-step3-t0",
        "c2-ports", "c2-pick", "c3-connecting", "c4-verify", "c5-yes1", "c6-spinning", "c7-ok", "c8-connected",
        "d0-home", "d1-homing", "d1-homed", "d2-plate", "d3-touch", "d4-probing", "d4-probed", "d5-zero", "d6-check", "d6-check-in",
      ];
      const RUN = [];
      for (let k = 1; k <= 17; k++) RUN.push("e-run" + String(k).padStart(2, "0"));
      SHOTS.push(...RUN, "e-done");
      SHOTS.forEach((id) => {
        const im = document.createElement("img");
        im.className = "shot";
        im.id = "s-" + id;
        im.src = "assets/shots/" + id + ".jpg";
        im.decoding = "sync";
        cam.appendChild(im);
      });

      /* 2) overlays inside the camera */
      const box = (b, pad = 0) => {
        const d = document.createElement("div");
        d.className = "hl";
        d.style.left = (b[0] - pad) * K + "px";
        d.style.top = (b[1] - pad) * K + "px";
        d.style.width = (b[2] + pad * 2) * K + "px";
        d.style.height = (b[3] + pad * 2) * K + "px";
        cam.appendChild(d);
        return d;
      };
      const hlWelcome = box([244, 414, 518, 134], 6);
      const hlPill = box([1118, 14, 168, 36], 3);
      const hlDone = box([1043, 152, 360, 70], 4);

      const cursor = document.createElement("div");
      cursor.id = "cursor";
      cursor.innerHTML =
        '<svg viewBox="0 0 34 34"><path d="M3 3 L3 26 L9.2 20.4 L13.6 30.4 L18.4 28.3 L14 18.4 L22.4 18.2 Z" fill="#fff" stroke="#111214" stroke-width="2" stroke-linejoin="round"/></svg>';
      cam.appendChild(cursor);

      /* 3) timeline helpers */
      const SPEED = 1.45; // video pace: 1.45x faster than the "natural" timing written below
      const main = gsap.timeline({ paused: true });
      const tl = gsap.timeline();
      let t = 0;
      let cx = 760,
        cy = 470; // cursor position in app CSS px
      const ctr = (b) => [b[0] + b[2] / 2, b[1] + b[3] / 2];

      const camMoves = [];
      const camTo = (at, dur, fx, fy, s, ease = "power3.inOut") => {
        let x = W / 2 - fx * K * s;
        let y = H / 2 - fy * K * s;
        x = Math.min(0, Math.max(W - W * s, x));
        y = Math.min(0, Math.max(H - H * s, y));
        camMoves.push({ at, dur, x, y, s, ease });
      };
      // a single camera: each move ends where the next one starts (no competing tweens)
      const buildCam = () => {
        camMoves.sort((a, b) => a.at - b.at);
        camMoves.forEach((m, i) => {
          const nx = camMoves[i + 1];
          let dur = m.dur;
          if (nx && m.at + dur > nx.at) dur = nx.at - m.at;
          if (dur < 0.12) return;
          tl.to(cam, { x: m.x, y: m.y, scale: m.s, duration: dur, ease: m.ease }, m.at);
        });
      };
      const move = (px, py, dur) => {
        // x and y with different eases trace a natural curve, not a robotic straight line
        tl.to(cursor, { x: px * K, duration: dur, ease: "sine.inOut" }, t);
        tl.to(cursor, { y: py * K, duration: dur, ease: "power2.out" }, t);
        cx = px;
        cy = py;
        t += dur;
      };
      const moveTo = (b, dur, dx = 0, dy = 0) => {
        const [px, py] = ctr(b);
        move(px + dx, py + dy, dur);
      };
      const press = () => {
        const svg = cursor.querySelector("svg");
        tl.to(svg, { scale: 0.82, duration: 0.07, ease: "power2.out" }, t);
      };
      const release = () => {
        const svg = cursor.querySelector("svg");
        tl.to(svg, { scale: 1, duration: 0.14, ease: "power2.out" }, t);
      };
      const click = () => {
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.left = cx * K + "px";
        r.style.top = cy * K + "px";
        cam.insertBefore(r, cursor);
        tl.fromTo(r, { opacity: 0.9, scale: 0.2 }, { opacity: 0, scale: 1.35, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
        press();
        t += 0.07;
        release();
        t += 0.06;
      };
      // each screenshot covers the whole screen: once the new one has finished coming in, the previous one leaves the compositor
      // (64 visible 2880x1800 images at once crash Chrome out of memory)
      let prevShot = null;
      const retire = (at) => {
        if (prevShot) tl.set(prevShot, { visibility: "hidden" }, at);
      };
      const show = (id, at = t, fade = 0) => {
        const el = document.getElementById("s-" + id);
        if (fade > 0) tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: fade, ease: "none", immediateRender: false }, at);
        else tl.set(el, { autoAlpha: 1 }, at);
        retire(at + fade + 0.01);
        prevShot = el;
      };
      const pop = (id, at = t) => show(id, at, 0.22);
      const typing = (ids, gap) => {
        ids.forEach((id) => {
          show(id, t);
          t += gap;
        });
      };
      const pulse = (el, at, hold = 1.2) => {
        tl.fromTo(el, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at);
        tl.to(el, { opacity: 0, duration: 0.5, ease: "power1.in" }, at + hold);
      };
      const cap = (id, inAt, outAt) => {
        tl.fromTo("#" + id, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, inAt);
        tl.to("#" + id, { opacity: 0, y: -14, duration: 0.3, ease: "power2.in" }, outAt);
      };

      /* targets (app CSS px, measured on the real screens by capture/cap.cjs -> targets.json) */
      const B = {
        addText: [1043, 715, 69, 34],
        content: [1058, 447, 330, 40],
        fontScript: [1283, 525, 105, 96],
        cont: [1043, 813, 360, 52],
        play: [135, 90, 133, 44],
        btn3d: [77, 92, 42, 40],
        pill: [1225, 14, 199, 36],
        cables: [783, 581, 472, 52],
        tick: [[798, 564, 442, 22], [798, 476, 442, 22], [798, 601, 442, 41], [798, 547, 442, 41]],
        next: [[1075, 653, 180, 44], [1075, 565, 180, 44], [1075, 708, 180, 44], [1075, 655, 180, 44]],
        port: [783, 364, 472, 65],
        connect: [1075, 483, 180, 44],
        moveUp: [798, 508, 166, 44],
        yes1: [913, 540, 57, 34],
        spin: [798, 679, 120, 44],
        yes2: [945, 711, 57, 34],
        allgood: [1075, 782, 180, 44],
        prim: [1043, 813, 360, 52],
        touch: [1267, 731, 123, 36],
        chkin: [1330, 333, 60, 36],
      };
      // "Letter height" thumb (range 8..70, 330 px track at x=1060)
      const thumbX = (v) => 1060 + 8 + ((v - 8) / 62) * 314;

      /* ===== A · design: text, font, size ===== */
      show("a0-blank", 0);
      tl.set(cursor, { x: cx * K, y: cy * K }, 0);
      tl.fromTo(cursor, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);
      cap("cap1", 0.5, 8.6);
      t = 0.6;
      camTo(0.7, 1.3, 1150, 640, 1.5, "power2.inOut");
      moveTo(B.addText, 1.1);
      t += 0.1;
      click();
      show("a1-text", t);
      camTo(t + 0.1, 0.9, 1180, 470, 1.55);
      t += 0.4;
      moveTo(B.content, 0.6, -40);
      t += 0.06;
      click();
      t += 0.1;
      typing(["a2-t1", "a2-t2", "a2-t3", "a2-t4"], 0.17);
      t += 0.15;
      camTo(t, 1.0, 860, 500, 1.18);
      moveTo(B.fontScript, 0.6);
      t += 0.06;
      click();
      show("a3-font", t, 0.12);
      t += 0.35;
      move(thumbX(20), 669, 0.55);
      t += 0.05;
      press();
      t += 0.1;
      [[25, "a3-h1"], [30, "a3-h2"], [34, "a3-h3"]].forEach(([v, id]) => {
        move(thumbX(v), 669, 0.22);
        show(id, t);
      });
      release();
      t += 0.15;
      pulse(hlWelcome, t, 1.1);
      camTo(t - 0.1, 1.0, 560, 470, 1.35);
      t += 1.3;

      /* ===== B · prepare: toolpath and 3D ===== */
      cap("cap2", t + 0.2, t + 6.4);
      camTo(t, 0.9, 1180, 760, 1.4);
      moveTo(B.cont, 0.8);
      t += 0.06;
      click();
      show("b0-prepare", t, 0.25);
      camTo(t + 0.2, 1.0, 420, 300, 1.3);
      t += 0.45;
      moveTo(B.play, 0.7);
      t += 0.06;
      click();
      typing(["b1-play1", "b1-play2", "b1-play3", "b1-play4", "b1-play5", "b1-play6"], 0.3);
      show("b1-playend", t);
      t += 0.35;
      moveTo(B.btn3d, 0.45);
      t += 0.06;
      click();
      show("b2-3d", t, 0.3);
      camTo(t + 0.1, 1.1, 460, 520, 1.45);
      t += 1.2;

      /* ===== C · connect: cables, port and tests ===== */
      cap("cap3", t + 0.3, t + 9.6);
      camTo(t, 0.9, 1200, 200, 1.5);
      moveTo(B.pill, 0.8);
      t += 0.06;
      click();
      pop("c0-wiz", t);
      camTo(t + 0.15, 0.9, 960, 520, 1.25);
      t += 0.45;
      moveTo(B.cables, 0.6);
      t += 0.05;
      click();
      show("c1-step0", t, 0.15);
      t += 0.3;
      [["c1-step0-t0", "c1-step1"], ["c1-step1-t0", "c1-step2"], ["c1-step2-t0", "c1-step3"], ["c1-step3-t0", "c2-ports"]].forEach(([ticked, nextId], i) => {
        moveTo(B.tick[i], 0.38, -190);
        click();
        show(ticked, t);
        t += 0.12;
        moveTo(B.next[i], 0.32);
        click();
        show(nextId, t, 0.12);
        t += 0.22;
      });
      camTo(t, 0.8, 1000, 440, 1.45);
      moveTo(B.port, 0.5, -60);
      click();
      show("c2-pick", t);
      t += 0.2;
      moveTo(B.connect, 0.45);
      click();
      show("c3-connecting", t, 0.12);
      t += 0.5;
      show("c4-verify", t, 0.2);
      camTo(t, 0.9, 960, 600, 1.35);
      t += 0.35;
      moveTo(B.moveUp, 0.5);
      click();
      t += 0.35;
      moveTo(B.yes1, 0.35);
      click();
      show("c5-yes1", t);
      t += 0.15;
      moveTo(B.spin, 0.4);
      click();
      show("c6-spinning", t, 0.12);
      t += 0.6;
      moveTo(B.yes2, 0.4);
      click();
      show("c7-ok", t);
      t += 0.2;
      moveTo(B.allgood, 0.5);
      click();
      show("c8-connected", t, 0.25);
      camTo(t + 0.1, 0.9, 1250, 120, 1.7);
      pulse(hlPill, t + 0.5, 1.2);
      move(1180, 220, 0.8);
      t += 0.9;

      /* ===== D · position and carve ===== */
      cap("cap4", t + 0.3, t + 11.0);
      show("d0-home", t, 0.3);
      camTo(t, 1.0, 1100, 640, 1.3);
      t += 0.3;
      moveTo(B.prim, 0.6);
      click();
      show("d1-homing", t, 0.12);
      t += 0.45;
      show("d1-homed", t, 0.2);
      t += 0.25;
      click();
      show("d2-plate", t, 0.15);
      t += 0.25;
      moveTo(B.touch, 0.4);
      click();
      show("d3-touch", t);
      t += 0.15;
      moveTo(B.prim, 0.4);
      click();
      show("d4-probing", t, 0.12);
      t += 0.4;
      show("d4-probed", t, 0.15);
      t += 0.2;
      click();
      show("d5-zero", t, 0.15);
      t += 0.25;
      click();
      show("d6-check", t, 0.25);
      camTo(t, 0.9, 1150, 520, 1.35);
      t += 0.35;
      moveTo(B.chkin, 0.5);
      click();
      show("d6-check-in", t);
      t += 0.2;
      moveTo(B.prim, 0.55);
      t += 0.05;
      click();
      show("e-run01", t, 0.2);
      camTo(t + 0.1, 1.2, 500, 470, 1.45);
      tl.to(cursor, { opacity: 0, duration: 0.3 }, t + 0.3);
      t += 0.3;
      typing(RUN.slice(1), 0.2);
      show("e-done", t, 0.35);
      camTo(t, 1.1, 640, 460, 1.0);
      pulse(hlDone, t + 0.6, 1.2);
      t += 1.7;

      buildCam();
      tl.timeScale(SPEED);
      const INTRO = 2.0; // where the "real" video starts (real seconds)
      const TOTAL = 34.875; // 18 bars of the soundtrack
      const tOut = INTRO + tl.duration() / SPEED; // when the outro starts
      main.add(tl, INTRO);

      /* ===== brand: cubic-bezier(.2,.8,.2,1) motion, no bounce ===== */
      const OUT = "power4.out"; // ≈ cubic-bezier(.2,.8,.2,1)
      const tl0 = main;
      // builds the icon: square -> board slides in -> bit plunges and opens the groove -> chips fly -> name comes in whole
      const buildLogo = (sfx, at) => {
        tl0.fromTo("#sq" + sfx, { opacity: 0, scale: 0.7, svgOrigin: "50 50" }, { opacity: 1, scale: 1, svgOrigin: "50 50", duration: 0.3, ease: OUT }, at);
        tl0.fromTo("#board" + sfx, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: OUT }, at + 0.2);
        tl0.fromTo("#bit" + sfx, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" }, at + 0.36);
        ["f1", "f2"].forEach((id, i) => tl0.fromTo("#" + id + sfx, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" }, at + 0.58 + i * 0.07));
        ["c1", "c2"].forEach((id, i) =>
          tl0.fromTo("#" + id + sfx, { opacity: 0, x: 8, y: 6 }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: OUT }, at + 0.62 + i * 0.08),
        );
        tl0.fromTo("#nmt" + sfx, { x: -150, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: OUT }, at + 0.85);
      };
      // transition: orange disc grows from the center, the second one covers it
      const cover = (a, b, at) => {
        tl0.fromTo(a, { scale: 0 }, { scale: 1, duration: 0.5, ease: OUT }, at);
        tl0.fromTo(b, { scale: 0 }, { scale: 1, duration: 0.5, ease: OUT }, at + 0.22);
      };

      // intro
      buildLogo("I", 0.12);
      cover("#d1I", "#d2I", 1.45);
      tl0.fromTo("#scene", { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)", duration: 0.6, ease: "power3.inOut" }, 1.85);

      // outro
      cover("#d1O", "#d2O", tOut);
      tl0.set("#outro", { visibility: "visible" }, tOut + 0.5);
      tl0.fromTo("#ocircle", { scale: 0 }, { scale: 1, duration: 0.8, ease: OUT }, tOut + 0.6);
      buildLogo("O", tOut + 0.6);
      ["#tag1", "#tag2"].forEach((id, i) => tl0.fromTo(id, { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: OUT }, tOut + 2.05 + i * 0.14));
      tl0.fromTo("#octa", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: OUT }, tOut + 2.55);
      tl0.fromTo("#orule", { opacity: 0, scaleX: 0, transformOrigin: "0 50%" }, { opacity: 1, scaleX: 1, duration: 0.5, ease: OUT }, tOut + 2.7);
      tl0.fromTo("#osite", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: OUT }, tOut + 2.8);
      window.__total = tOut;
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = main;
      main.seek(0);
    </script>
  </body>
</html>
