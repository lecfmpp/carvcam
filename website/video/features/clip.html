<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <!-- Clipes curtos dos recursos da home: o mesmo motor do vídeo do hero (prints reais, câmera com zoom,
         cursor e cliques), sem abertura nem legenda, e em loop sem emenda. clip.html?scene=design|prepare|connect|carve -->
    <script src="../hero-demo/assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1200px;
        overflow: hidden;
        background: #111214;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1200px;
        transform-origin: 0 0;
        will-change: transform;
      }
      #cam img.shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1200px;
        opacity: 0;
        visibility: hidden;
        display: block;
      }
      .hl {
        position: absolute;
        opacity: 0;
        border-radius: 14px;
        pointer-events: none;
        border: 3px solid #ff5b1f;
        box-shadow: 0 0 0 6px rgba(255, 91, 31, 0.25), 0 10px 40px rgba(255, 91, 31, 0.4);
        background: rgba(255, 91, 31, 0.06);
      }
      .ripple {
        position: absolute;
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        border-radius: 50%;
        border: 3px solid #ff5b1f;
        background: rgba(255, 91, 31, 0.25);
        opacity: 0;
        pointer-events: none;
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        pointer-events: none;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.55));
      }
      #cursor svg {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 3px 3px;
      }
    </style>
  </head>
  <body>
    <div id="cam"></div>
    <script>
      const K = 1920 / 1440; // CSS px do app -> px do vídeo
      const W = 1920;
      const H = 1200;
      const cam = document.getElementById("cam");
      const scene = new URLSearchParams(location.search).get("scene") || "design";

      const RUN = [];
      for (let k = 1; k <= 17; k++) RUN.push("e-run" + String(k).padStart(2, "0"));
      const SHOTS = {
        design: ["a0-blank", "a1-text", "a2-t1", "a2-t2", "a2-t3", "a2-t4", "a3-font", "a3-h1", "a3-h2", "a3-h3"],
        prepare: ["b0-prepare", "b1-play1", "b1-play2", "b1-play3", "b1-play4", "b1-play5", "b1-play6", "b1-playend", "b2-3d"],
        connect: ["c0-wiz", "c1-step0", "c1-step0-t0", "c1-step1", "c1-step1-t0", "c1-step2", "c1-step2-t0", "c1-step3", "c1-step3-t0", "c2-ports", "c2-pick", "c3-connecting", "c4-verify", "c5-yes1", "c6-spinning", "c7-ok"],
        carve: ["d6-check", "d6-check-in", ...RUN, "e-done"],
      }[scene];
      // o primeiro print entra de novo por cima no fim: o loop fecha sem salto
      [...SHOTS, SHOTS[0]].forEach((id, i) => {
        const im = document.createElement("img");
        im.className = "shot";
        im.id = "s-" + id + (i === SHOTS.length ? "-loop" : "");
        im.src = "../hero-demo/assets/shots/" + id + ".jpg";
        im.decoding = "sync";
        cam.appendChild(im);
      });

      const box = (b, pad = 0) => {
        const d = document.createElement("div");
        d.className = "hl";
        d.style.left = (b[0] - pad) * K + "px";
        d.style.top = (b[1] - pad) * K + "px";
        d.style.width = (b[2] + pad * 2) * K + "px";
        d.style.height = (b[3] + pad * 2) * K + "px";
        cam.appendChild(d);
        return d;
      };
      const cursor = document.createElement("div");
      cursor.id = "cursor";
      cursor.innerHTML =
        '<svg viewBox="0 0 34 34"><path d="M3 3 L3 26 L9.2 20.4 L13.6 30.4 L18.4 28.3 L14 18.4 L22.4 18.2 Z" fill="#fff" stroke="#111214" stroke-width="2" stroke-linejoin="round"/></svg>';
      cam.appendChild(cursor);

      /* helpers (os mesmos do hero) */
      const main = gsap.timeline({ paused: true });
      const tl = main;
      let t = 0;
      let cx = 760,
        cy = 470;
      const ctr = (b) => [b[0] + b[2] / 2, b[1] + b[3] / 2];
      const camMoves = [];
      const camTo = (at, dur, fx, fy, s, ease = "power3.inOut") => {
        let x = W / 2 - fx * K * s;
        let y = H / 2 - fy * K * s;
        x = Math.min(0, Math.max(W - W * s, x));
        y = Math.min(0, Math.max(H - H * s, y));
        camMoves.push({ at, dur, x, y, s, ease });
      };
      const buildCam = () => {
        camMoves.sort((a, b) => a.at - b.at);
        camMoves.forEach((m, i) => {
          const nx = camMoves[i + 1];
          let dur = m.dur;
          if (nx && m.at + dur > nx.at) dur = nx.at - m.at;
          if (dur < 0.12) return;
          tl.to(cam, { x: m.x, y: m.y, scale: m.s, duration: dur, ease: m.ease }, m.at);
        });
      };
      const move = (px, py, dur) => {
        tl.to(cursor, { x: px * K, duration: dur, ease: "sine.inOut" }, t);
        tl.to(cursor, { y: py * K, duration: dur, ease: "power2.out" }, t);
        cx = px;
        cy = py;
        t += dur;
      };
      const moveTo = (b, dur, dx = 0, dy = 0) => {
        const [px, py] = ctr(b);
        move(px + dx, py + dy, dur);
      };
      const svg = cursor.querySelector("svg");
      const press = () => tl.to(svg, { scale: 0.82, duration: 0.07, ease: "power2.out" }, t);
      const release = () => tl.to(svg, { scale: 1, duration: 0.14, ease: "power2.out" }, t);
      const click = () => {
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.left = cx * K + "px";
        r.style.top = cy * K + "px";
        cam.insertBefore(r, cursor);
        tl.fromTo(r, { opacity: 0.9, scale: 0.2 }, { opacity: 0, scale: 1.35, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
        press();
        t += 0.07;
        release();
        t += 0.06;
      };
      let prevShot = null;
      const showEl = (el, at, fade) => {
        if (fade > 0) tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: fade, ease: "none", immediateRender: false }, at);
        else tl.set(el, { autoAlpha: 1 }, at);
        if (prevShot) tl.set(prevShot, { visibility: "hidden" }, at + fade + 0.01);
        prevShot = el;
      };
      const show = (id, at = t, fade = 0) => showEl(document.getElementById("s-" + id), at, fade);
      const typing = (ids, gap) =>
        ids.forEach((id) => {
          show(id, t);
          t += gap;
        });
      const pulse = (el, at, hold = 1.2) => {
        tl.fromTo(el, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at);
        tl.to(el, { opacity: 0, duration: 0.5, ease: "power1.in" }, at + hold);
      };
      // fim do loop: câmera e cursor voltam à pose inicial enquanto o primeiro print reaparece
      const START = { cx: 0, cy: 0 };
      const begin = (x, y) => {
        cx = START.cx = x;
        cy = START.cy = y;
        // pose inicial fora da timeline: um set no tempo 0 não é aplicado ao buscar o quadro 0
        gsap.set(cursor, { x: x * K, y: y * K });
        gsap.set(cam, { x: 0, y: 0, scale: 1 });
        prevShot = document.getElementById("s-" + SHOTS[0]);
        gsap.set(prevShot, { autoAlpha: 1 });
      };
      const loopBack = (hold) => {
        t += hold;
        camTo(t, 0.9, 720, 450, 1.0);
        move(START.cx, START.cy, 0.9);
        showEl(document.getElementById("s-" + SHOTS[0] + "-loop"), t - 0.5, 0.4);
        t += 0.25;
      };

      /* alvos (px CSS do app, de capture/targets.json) */
      const B = {
        addText: [1043, 715, 69, 34],
        content: [1058, 447, 330, 40],
        fontScript: [1283, 525, 105, 96],
        play: [135, 90, 133, 44],
        btn3d: [77, 92, 42, 40],
        cables: [783, 581, 472, 52],
        tick: [[798, 564, 442, 22], [798, 476, 442, 22], [798, 601, 442, 41], [798, 547, 442, 41]],
        next: [[1075, 653, 180, 44], [1075, 565, 180, 44], [1075, 708, 180, 44], [1075, 655, 180, 44]],
        port: [783, 364, 472, 65],
        connect: [1075, 483, 180, 44],
        moveUp: [798, 508, 166, 44],
        yes1: [913, 540, 57, 34],
        spin: [798, 679, 120, 44],
        yes2: [945, 711, 57, 34],
        prim: [1043, 813, 360, 52],
        chkin: [1330, 333, 60, 36],
      };
      const thumbX = (v) => 1060 + 8 + ((v - 8) / 62) * 314;

      if (scene === "design") {
        begin(760, 470);
        t = 0.4;
        camTo(0.4, 1.1, 1150, 640, 1.45, "power2.inOut");
        moveTo(B.addText, 0.9);
        t += 0.08;
        click();
        show("a1-text", t);
        camTo(t + 0.1, 0.9, 1180, 470, 1.5);
        t += 0.35;
        moveTo(B.content, 0.55, -40);
        click();
        t += 0.08;
        typing(["a2-t1", "a2-t2", "a2-t3", "a2-t4"], 0.18);
        t += 0.15;
        camTo(t, 1.0, 860, 500, 1.15);
        moveTo(B.fontScript, 0.6);
        click();
        show("a3-font", t, 0.12);
        t += 0.35;
        move(thumbX(20), 669, 0.5);
        press();
        t += 0.12;
        [[25, "a3-h1"], [30, "a3-h2"], [34, "a3-h3"]].forEach(([v, id]) => {
          move(thumbX(v), 669, 0.24);
          show(id, t);
        });
        release();
        t += 0.15;
        pulse(box([244, 414, 518, 134], 6), t, 1.1);
        camTo(t - 0.1, 1.0, 560, 470, 1.35);
        loopBack(1.4);
      } else if (scene === "prepare") {
        begin(600, 420);
        t = 0.4;
        camTo(0.3, 1.0, 420, 300, 1.3);
        moveTo(B.play, 0.8);
        click();
        typing(["b1-play1", "b1-play2", "b1-play3", "b1-play4", "b1-play5", "b1-play6"], 0.32);
        show("b1-playend", t);
        camTo(t - 0.6, 1.0, 600, 470, 1.2);
        t += 0.45;
        moveTo(B.btn3d, 0.5);
        click();
        show("b2-3d", t, 0.3);
        camTo(t + 0.1, 1.2, 460, 520, 1.45);
        t += 0.8;
        move(1110, 540, 0.9);
        camTo(t, 1.0, 1150, 520, 1.4);
        pulse(box([1043, 501, 360, 52], 2), t + 0.7, 1.1);
        loopBack(1.6);
      } else if (scene === "connect") {
        begin(960, 760);
        t = 0.3;
        camTo(0.3, 0.9, 960, 520, 1.25);
        moveTo(B.cables, 0.7);
        click();
        show("c1-step0", t, 0.15);
        t += 0.3;
        [["c1-step0-t0", "c1-step1"], ["c1-step1-t0", "c1-step2"], ["c1-step2-t0", "c1-step3"], ["c1-step3-t0", "c2-ports"]].forEach(([ticked, nextId], i) => {
          moveTo(B.tick[i], 0.4, -190);
          click();
          show(ticked, t);
          t += 0.14;
          moveTo(B.next[i], 0.34);
          click();
          show(nextId, t, 0.12);
          t += 0.25;
        });
        camTo(t, 0.8, 1000, 440, 1.45);
        moveTo(B.port, 0.5, -60);
        click();
        show("c2-pick", t);
        t += 0.2;
        moveTo(B.connect, 0.45);
        click();
        show("c3-connecting", t, 0.12);
        t += 0.5;
        show("c4-verify", t, 0.2);
        camTo(t, 0.9, 960, 600, 1.35);
        t += 0.35;
        moveTo(B.moveUp, 0.5);
        click();
        t += 0.35;
        moveTo(B.yes1, 0.35);
        click();
        show("c5-yes1", t);
        t += 0.15;
        moveTo(B.spin, 0.4);
        click();
        show("c6-spinning", t, 0.12);
        t += 0.6;
        moveTo(B.yes2, 0.4);
        click();
        show("c7-ok", t);
        loopBack(1.4);
      } else if (scene === "carve") {
        begin(1200, 700);
        t = 0.3;
        camTo(0.3, 0.9, 1150, 450, 1.35);
        moveTo(B.chkin, 0.6);
        click();
        show("d6-check-in", t);
        t += 0.25;
        camTo(t, 0.8, 1150, 700, 1.3);
        moveTo(B.prim, 0.6);
        click();
        show("e-run01", t, 0.2);
        camTo(t + 0.1, 1.2, 500, 470, 1.45);
        tl.to(cursor, { opacity: 0, duration: 0.3 }, t + 0.3);
        t += 0.3;
        typing(RUN.slice(1), 0.24);
        show("e-done", t, 0.35);
        camTo(t, 1.1, 640, 460, 1.0);
        pulse(box([1043, 152, 360, 70], 4), t + 0.6, 1.3);
        tl.to(cursor, { opacity: 1, duration: 0.3 }, t + 1.6);
        loopBack(1.9);
      }
      buildCam();
      window.__duration = t;
      window.__timelines = { main };
      main.seek(0);
    </script>
  </body>
