<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <!-- Short clips for the home page features: the same engine as the hero video (real screenshots, zooming camera,
         cursor and clicks), with no intro or captions, and a seamless loop. clip.html?scene=design|prepare|connect|carve -->
    <script src="../hero-demo/assets/gsap.min.js"></script>
    <script src="../hero-demo/assets/targets.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1200px;
        overflow: hidden;
        background: #111214;
      }
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1200px;
        transform-origin: 0 0;
        will-change: transform;
      }
      #cam img.shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1200px;
        opacity: 0;
        visibility: hidden;
        display: block;
      }
      .hl {
        position: absolute;
        opacity: 0;
        border-radius: 14px;
        pointer-events: none;
        border: 3px solid #ff5b1f;
        box-shadow: 0 0 0 6px rgba(255, 91, 31, 0.25), 0 10px 40px rgba(255, 91, 31, 0.4);
        background: rgba(255, 91, 31, 0.06);
      }
      .ripple {
        position: absolute;
        width: 70px;
        height: 70px;
        margin: -35px 0 0 -35px;
        border-radius: 50%;
        border: 3px solid #ff5b1f;
        background: rgba(255, 91, 31, 0.25);
        opacity: 0;
        pointer-events: none;
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 34px;
        height: 34px;
        pointer-events: none;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.55));
      }
      #cursor svg {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 3px 3px;
      }
    </style>
  </head>
  <body>
    <div id="cam"></div>
    <script>
      const K = 1920 / 1440; // app CSS px -> video px
      const W = 1920;
      const H = 1200;
      const cam = document.getElementById("cam");
      const scene = new URLSearchParams(location.search).get("scene") || "design";

      const B = window.TARGETS; // button boxes measured on the real screens by ../hero-demo/capture/cap.cjs
      const seq = (pre, n) => Array.from({ length: n }, (_, i) => pre + String(i + 1).padStart(2, "0"));
      const RUN = seq("e-run", B.runFrames);
      const CUT = seq("e-cut", B.cutFrames);
      const SHOTS = {
        design: ["a0-start", "a1-select", "a2-t1", "a2-t2", "a2-t3", "a3-font", "a3-h1", "a3-h2", "a4-copies", "a5-n2", "a5-n3", "a5-n4", "a5-n5", "a5-n6", "a6-done"],
        prepare: ["b0-prepare", "b1-play1", "b1-play2", "b1-play3", "b1-play4", "b1-play5", "b1-play6", "b1-play7", "b1-playend", "b2-3d", "b3-sending", "b3-sent"],
        connect: ["c0-wiz", "c1-step0", "c1-step0-t0", "c1-step1", "c1-step1-t0", "c1-step2", "c1-step2-t0", "c1-step3", "c1-step3-t0", "c2-ports", "c4-verify", "c5-yes1", "c6-spinning", "c7-ok"],
        carve: ["d6-check", "d6-check-in", ...RUN, "e-change", "e-change1", "e-change2", ...CUT, "e-done"],
      }[scene];
      // the first screenshot comes back on top at the end: the loop closes without a jump
      [...SHOTS, SHOTS[0]].forEach((id, i) => {
        const im = document.createElement("img");
        im.className = "shot";
        im.id = "s-" + id + (i === SHOTS.length ? "-loop" : "");
        im.src = "../hero-demo/assets/shots/" + id + ".jpg";
        im.decoding = "sync";
        cam.appendChild(im);
      });

      const box = (b, pad = 0) => {
        const d = document.createElement("div");
        d.className = "hl";
        d.style.left = (b[0] - pad) * K + "px";
        d.style.top = (b[1] - pad) * K + "px";
        d.style.width = (b[2] + pad * 2) * K + "px";
        d.style.height = (b[3] + pad * 2) * K + "px";
        cam.appendChild(d);
        return d;
      };
      const cursor = document.createElement("div");
      cursor.id = "cursor";
      cursor.innerHTML =
        '<svg viewBox="0 0 34 34"><path d="M3 3 L3 26 L9.2 20.4 L13.6 30.4 L18.4 28.3 L14 18.4 L22.4 18.2 Z" fill="#fff" stroke="#111214" stroke-width="2" stroke-linejoin="round"/></svg>';
      cam.appendChild(cursor);

      /* helpers (the same as the hero) */
      const main = gsap.timeline({ paused: true });
      const tl = main;
      let t = 0;
      let cx = 760,
        cy = 470;
      const ctr = (b) => [b[0] + b[2] / 2, b[1] + b[3] / 2];
      const camMoves = [];
      const camTo = (at, dur, fx, fy, s, ease = "power3.inOut") => {
        let x = W / 2 - fx * K * s;
        let y = H / 2 - fy * K * s;
        x = Math.min(0, Math.max(W - W * s, x));
        y = Math.min(0, Math.max(H - H * s, y));
        camMoves.push({ at, dur, x, y, s, ease });
      };
      const buildCam = () => {
        camMoves.sort((a, b) => a.at - b.at);
        camMoves.forEach((m, i) => {
          const nx = camMoves[i + 1];
          let dur = m.dur;
          if (nx && m.at + dur > nx.at) dur = nx.at - m.at;
          if (dur < 0.12) return;
          tl.to(cam, { x: m.x, y: m.y, scale: m.s, duration: dur, ease: m.ease }, m.at);
        });
      };
      const move = (px, py, dur) => {
        tl.to(cursor, { x: px * K, duration: dur, ease: "sine.inOut" }, t);
        tl.to(cursor, { y: py * K, duration: dur, ease: "power2.out" }, t);
        cx = px;
        cy = py;
        t += dur;
      };
      const moveTo = (b, dur, dx = 0, dy = 0) => {
        const [px, py] = ctr(b);
        move(px + dx, py + dy, dur);
      };
      const svg = cursor.querySelector("svg");
      const press = () => tl.to(svg, { scale: 0.82, duration: 0.07, ease: "power2.out" }, t);
      const release = () => tl.to(svg, { scale: 1, duration: 0.14, ease: "power2.out" }, t);
      const click = () => {
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.left = cx * K + "px";
        r.style.top = cy * K + "px";
        cam.insertBefore(r, cursor);
        tl.fromTo(r, { opacity: 0.9, scale: 0.2 }, { opacity: 0, scale: 1.35, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
        press();
        t += 0.07;
        release();
        t += 0.06;
      };
      let prevShot = null;
      const showEl = (el, at, fade) => {
        if (fade > 0) tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: fade, ease: "none", immediateRender: false }, at);
        else tl.set(el, { autoAlpha: 1 }, at);
        if (prevShot) tl.set(prevShot, { visibility: "hidden" }, at + fade + 0.01);
        prevShot = el;
      };
      const show = (id, at = t, fade = 0) => showEl(document.getElementById("s-" + id), at, fade);
      const typing = (ids, gap) =>
        ids.forEach((id) => {
          show(id, t);
          t += gap;
        });
      const pulse = (el, at, hold = 1.2) => {
        tl.fromTo(el, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at);
        tl.to(el, { opacity: 0, duration: 0.5, ease: "power1.in" }, at + hold);
      };
      // end of the loop: camera and cursor return to the starting pose while the first screenshot reappears
      const START = { cx: 0, cy: 0 };
      const begin = (x, y) => {
        cx = START.cx = x;
        cy = START.cy = y;
        // starting pose outside the timeline: a set at time 0 is not applied when seeking to frame 0
        gsap.set(cursor, { x: x * K, y: y * K });
        gsap.set(cam, { x: 0, y: 0, scale: 1 });
        prevShot = document.getElementById("s-" + SHOTS[0]);
        gsap.set(prevShot, { autoAlpha: 1 });
      };
      const loopBack = (hold) => {
        t += hold;
        camTo(t, 0.9, 720, 450, 1.0);
        move(START.cx, START.cy, 0.9);
        showEl(document.getElementById("s-" + SHOTS[0] + "-loop"), t - 0.5, 0.4);
        t += 0.25;
      };

      /* targets: B (window.TARGETS, from ../hero-demo/assets/targets.js) */
      // "Letter height" thumb (range 8..70, 16 px thumb)
      const thumbX = (v) => B.height[0] + 8 + ((v - 8) / 62) * (B.height[2] - 16);
      const thumbY = B.height[1] + B.height[3] / 2;

      if (scene === "design") {
        // type the name, pick the font, size it, then one name per linked copy
        begin(760, 560);
        t = 0.3;
        camTo(0.3, 1.0, 360, 420, 1.35, "power2.inOut");
        moveTo(B.tagText, 0.8);
        click();
        show("a1-select", t);
        camTo(t + 0.1, 0.9, 1100, 380, 1.5);
        t += 0.3;
        moveTo(B.content, 0.5, -60);
        click();
        t += 0.08;
        typing(["a2-t1", "a2-t2", "a2-t3"], 0.22);
        t += 0.1;
        moveTo(B.fontArchivo, 0.45);
        click();
        show("a3-font", t, 0.12);
        t += 0.3;
        move(thumbX(8), thumbY, 0.45);
        press();
        t += 0.1;
        [[9, "a3-h1"], [10, "a3-h2"]].forEach(([v, id]) => {
          move(thumbX(v), thumbY, 0.26);
          show(id, t);
        });
        release();
        t += 0.2;
        camTo(t, 1.0, 760, 420, 1.15);
        moveTo(B.copies, 0.7);
        click();
        show("a4-copies", t, 0.15);
        t += 0.3;
        camTo(t, 0.9, 900, 430, 1.25);
        moveTo(B.names, 0.5, -80, 10);
        click();
        t += 0.1;
        typing(["a5-n2", "a5-n3", "a5-n4", "a5-n5", "a5-n6"], 0.36);
        moveTo(B.copiesDone, 0.45);
        click();
        show("a6-done", t, 0.2);
        camTo(t, 1.0, 420, 470, 1.4);
        move(760, 560, 0.6);
        pulse(box([92, 287, 551, 389], 6), t - 0.3, 1.1);
        loopBack(1.2);
      } else if (scene === "prepare") {
        // play the toolpath, 3D, then Send to gSender (no post-processor to pick)
        begin(600, 420);
        t = 0.4;
        camTo(0.3, 1.0, 460, 380, 1.25);
        moveTo(B.play, 0.8);
        click();
        typing(["b1-play1", "b1-play2", "b1-play3", "b1-play4", "b1-play5", "b1-play6", "b1-play7"], 0.3);
        show("b1-playend", t);
        t += 0.3;
        moveTo(B.btn3d, 0.5);
        click();
        show("b2-3d", t, 0.3);
        camTo(t + 0.1, 1.1, 520, 500, 1.35);
        t += 1.1;
        camTo(t, 1.0, 1180, 700, 1.45);
        moveTo(B.gsender, 0.9);
        click();
        show("b3-sending", t);
        t += 0.25;
        show("b3-sent", t, 0.2);
        pulse(box([1043, 645, 360, 102], 4), t + 0.3, 1.2); // "Sent to gSender" + "Loaded as …"
        pulse(box(B.noPost, 4), t + 1.0, 1.1);
        move(860, 600, 0.7);
        loopBack(1.6);
      } else if (scene === "connect") {
        begin(960, 760);
        t = 0.3;
        camTo(0.3, 0.9, 960, 520, 1.25);
        moveTo(B.cables, 0.7);
        click();
        show("c1-step0", t, 0.15);
        t += 0.3;
        [["c1-step0-t0", "c1-step1"], ["c1-step1-t0", "c1-step2"], ["c1-step2-t0", "c1-step3"], ["c1-step3-t0", "c2-ports"]].forEach(([ticked, nextId], i) => {
          moveTo(B["tick" + i + "_0"], 0.4, -190);
          click();
          show(ticked, t);
          t += 0.14;
          moveTo(B["next" + i], 0.34);
          click();
          show(nextId, t, 0.12);
          t += 0.25;
        });
        t += 0.3;
        moveTo(B.connect, 0.5);
        click();
        show("c4-verify", t, 0.25);
        camTo(t, 0.9, 960, 600, 1.35);
        t += 0.35;
        moveTo(B.moveUp, 0.5);
        click();
        t += 0.35;
        moveTo(B.yes1, 0.35);
        click();
        show("c5-yes1", t);
        t += 0.15;
        moveTo(B.spin, 0.4);
        click();
        show("c6-spinning", t, 0.12);
        t += 0.6;
        moveTo(B.yes2, 0.4);
        click();
        show("c7-ok", t);
        loopBack(1.4);
      } else if (scene === "carve") {
        // start, live preview, guided bit change, cut-outs, finished piece
        begin(1200, 700);
        t = 0.3;
        camTo(0.3, 0.9, 1150, 450, 1.35);
        moveTo(B.chkin, 0.6);
        click();
        show("d6-check-in", t);
        t += 0.25;
        camTo(t, 0.8, 1150, 700, 1.3);
        moveTo(B.start, 0.6);
        click();
        show(RUN[0], t, 0.2);
        camTo(t + 0.1, 1.2, 500, 470, 1.4);
        tl.to(cursor, { opacity: 0, duration: 0.3 }, t + 0.3);
        t += 0.3;
        typing(RUN.slice(1), 0.2);
        show("e-change", t, 0.25);
        camTo(t, 0.9, 1100, 520, 1.3);
        tl.to(cursor, { opacity: 1, duration: 0.3 }, t);
        t += 0.6;
        moveTo(B.swapped, 0.45);
        click();
        show("e-change1", t);
        t += 0.25;
        click();
        show("e-change2", t, 0.15);
        t += 0.3;
        click();
        show(CUT[0], t, 0.2);
        camTo(t + 0.1, 1.0, 500, 470, 1.4);
        tl.to(cursor, { opacity: 0, duration: 0.3 }, t + 0.3);
        t += 0.3;
        typing(CUT.slice(1), 0.2);
        show("e-done", t, 0.35);
        camTo(t, 1.1, 640, 460, 1.0);
        pulse(box([1043, 152, 360, 132], 4), t + 0.6, 1.3);
        tl.to(cursor, { opacity: 1, duration: 0.3 }, t + 1.6);
        loopBack(1.9);
      }
      buildCam();
      window.__duration = t;
      window.__timelines = { main };
      main.seek(0);
    </script>
  </body>
