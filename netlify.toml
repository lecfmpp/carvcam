# Static site: the build generates dist/ from src/ (no framework, no runtime dependencies).
[build]
  base = "website"
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# HTML always revalidates (deploys show up immediately); everything else is cached for a long time.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/screens/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Agent discovery (RFC 8288 Link headers): the homepage points agents to the catalog, the skills,
# the Markdown version, the LLM index, the docs and the sitemap.
[[headers]]
  for = "/"
  [headers.values]
    Link = '''</.well-known/ai-catalog.json>; rel="ai-catalog"; type="application/json", </.well-known/agent-skills/index.json>; rel="agent-skills"; type="application/json", </index.md>; rel="alternate"; type="text/markdown", </llms.txt>; rel="describedby"; type="text/plain", </docs/>; rel="service-doc", </sitemap.xml>; rel="sitemap"; type="application/xml"'''

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/.well-known/agent-skills/*/SKILL.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Markdown versions and the index for agents (llms.txt)
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Account pages: the browser script and the vendored Supabase client
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Installer downloads: carvcam.com/download/<platform> always serves the newest release, from the
# fixed-name files on this repository's latest GitHub Release. The Installers workflow also mirrors
# them to the public Supabase Storage bucket "downloads" once the SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY secrets are set; to serve from there, replace
#   https://github.com/lecfmpp/carvcam/releases/latest/download/
# with
#   https://zveqsvizefgbicwvjvdu.supabase.co/storage/v1/object/public/downloads/latest/
# 302 so browsers never cache an old target.
[[redirects]]
  from = "/download/windows"
  to = "https://github.com/lecfmpp/carvcam/releases/latest/download/CarvCAM-Windows-64Bit.exe"
  status = 302
[[redirects]]
  from = "/download/mac-apple-silicon"
  to = "https://github.com/lecfmpp/carvcam/releases/latest/download/CarvCAM-Mac-arm64.dmg"
  status = 302
[[redirects]]
  from = "/download/mac-intel"
  to = "https://github.com/lecfmpp/carvcam/releases/latest/download/CarvCAM-Mac-x64.dmg"
  status = 302
[[redirects]]
  from = "/download/linux-appimage"
  to = "https://github.com/lecfmpp/carvcam/releases/latest/download/CarvCAM-Linux-x86_64.AppImage"
  status = 302
[[redirects]]
  from = "/download/linux-deb"
  to = "https://github.com/lecfmpp/carvcam/releases/latest/download/CarvCAM-Linux-amd64.deb"
  status = 302
[[redirects]]
  from = "/download/raspberry-pi-deb"
  to = "https://github.com/lecfmpp/carvcam/releases/latest/download/CarvCAM-Linux-arm64.deb"
  status = 302
[[redirects]]
  from = "/download/raspberry-pi-appimage"
  to = "https://github.com/lecfmpp/carvcam/releases/latest/download/CarvCAM-Linux-arm64.AppImage"
  status = 302
[[redirects]]
  from = "/download/raspberry-pi-32bit-deb"
  to = "https://github.com/lecfmpp/carvcam/releases/latest/download/CarvCAM-Linux-armv7l.deb"
  status = 302

# Removed pages: Send to gSender was taken out of the app (CarvCAM runs the machine itself; Prepare
# still has Download G-code for any other sender). Old links land on Prepare.
[[redirects]]
  from = "/docs/send-to-gsender/"
  to = "/docs/prepare/"
  status = 301
[[redirects]]
  from = "/docs/send-to-gsender"
  to = "/docs/prepare/"
  status = 301
[[redirects]]
  from = "/docs/send-to-gsender/index.md"
  to = "/docs/prepare/index.md"
  status = 301
